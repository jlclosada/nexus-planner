version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus_db
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: nexus_db
    ports:
      - "5433:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  nexus_postgres_data:
